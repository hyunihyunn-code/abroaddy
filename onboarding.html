<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>어브로디 · 핵심 기능 목업 v9 · 온보딩</title>
<style>
:root{
  --page:#f9f9f7; --surface:#fcfcfb; --white:#ffffff;
  --ink:#0b0b0b; --ink-sec:#52514e; --muted:#898781;
  --line:#ebeae4; --grid:#e1e0d9; --border:rgba(11,11,11,.10);
  --accent:#2a78d6; --accent-soft:#cde2fb; --accent-mid:#86b6ef; --accent-dark:#184f95;
  --warn:#eb6834; --warn-soft:#fbe3d8; --good:#006300; --chip:#f0efec;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;padding:32px 20px 60px;
  position:relative;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20% -10% auto -10%;height:70vh;z-index:-2;pointer-events:none;
  background:
    radial-gradient(46% 40% at 18% 12%, rgba(42,120,214,.46), transparent 68%),
    radial-gradient(40% 36% at 82% 6%,  rgba(123,90,214,.36), transparent 70%),
    radial-gradient(38% 34% at 62% 42%, rgba(134,182,239,.44), transparent 72%);
  filter:blur(40px);opacity:1}
body::after{content:"";position:fixed;inset:auto -10% -15% -10%;height:52vh;z-index:-2;pointer-events:none;
  background:
    radial-gradient(42% 44% at 24% 86%, rgba(42,120,214,.30), transparent 70%),
    radial-gradient(36% 40% at 78% 92%, rgba(205,226,251,.60), transparent 72%);
  filter:blur(46px);opacity:1}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.stage{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:44px;align-items:start}
@media(max-width:900px){.stage{grid-template-columns:1fr;gap:28px}.device{order:-1}.spec{position:static}}
.masthead{margin-bottom:26px}
.masthead h1{font-size:26px;letter-spacing:-.02em;margin:0 0 6px;font-weight:700}
.masthead p{margin:0;color:var(--ink-sec);font-size:14px;line-height:1.6}
.masthead .note{margin-top:10px;font-size:12.5px;color:var(--muted)}
.spec{position:sticky;top:32px}
.spec h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600}
.feat{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:13px;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin-bottom:8px;transition:border-color .18s,background .18s}
.feat:hover{border-color:var(--grid)}
.feat[aria-current="true"]{border-color:var(--accent-mid);background:rgba(244,249,255,.86)}
.feat .fnum{font-size:11px;color:var(--muted);letter-spacing:.06em}
.feat[aria-current="true"] .fnum{color:var(--accent)}
.feat .ftitle{font-size:14.5px;font-weight:600;margin:3px 0 2px;letter-spacing:-.01em}
.feat .fdesc{font-size:12.5px;color:var(--ink-sec);line-height:1.5}
.feat .ftag{display:inline-block;margin-top:7px;font-size:11px;padding:2px 7px;border-radius:5px;background:var(--chip);color:var(--ink-sec)}

.device{width:390px;max-width:100%;margin:0 auto;border-radius:38px;background:#161616;padding:11px;position:relative;box-shadow:0 24px 60px -22px rgba(11,11,11,.42),0 2px 6px rgba(11,11,11,.16)}
.screen{position:relative;background:var(--page);border-radius:28px;overflow:hidden;height:768px;display:flex;flex-direction:column}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 22px 4px;font-size:13px;font-weight:600}
.statusbar .sig{letter-spacing:1px;font-size:11px;color:var(--ink-sec)}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 18px 14px}
.view::-webkit-scrollbar{width:0}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--white);padding:6px 4px 12px;align-items:flex-end}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:10.5px}
.tab .ic{font-size:17px;line-height:1}
.tab[aria-current="true"]{color:var(--accent);font-weight:600}
.tab.plus{padding:0 0 6px}
.tab.plus .ic{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:25px;font-weight:300;box-shadow:0 4px 12px -3px rgba(42,120,214,.5)}

/* topbar with workspace switcher */
.topbar{display:flex;align-items:center;gap:9px;padding:6px 0 14px}
.wsbtn{display:flex;align-items:center;gap:9px;padding:7px 11px 7px 9px;border-radius:11px;background:var(--white);border:1px solid var(--line);flex:1;min-width:0;text-align:left}
.wsbtn .bars{display:flex;flex-direction:column;gap:3px;flex:none;padding:0 2px}
.wsbtn .bars i{display:block;width:15px;height:1.6px;background:var(--ink-sec);border-radius:2px}
.wsbtn .nm{flex:1;min-width:0}
.wsbtn .nm b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsbtn .nm span{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.wsbtn .cv{color:var(--muted);font-size:12px;flex:none}

.hd{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 12px;gap:8px}
.hd h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:12.5px;color:var(--muted)}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card + .card{margin-top:10px}
.rowbetween{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--chip);font-size:12.5px;color:var(--ink-sec);border:1px solid transparent}
.chip.on{background:var(--accent-soft);color:var(--accent-dark);border-color:var(--accent-mid);font-weight:600}
.chip.solid{background:var(--accent);color:#fff;font-weight:600;border-color:var(--accent)}
.money{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.approx{color:var(--muted);font-size:11.5px;font-weight:400}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:15px}
.btn:disabled{background:var(--grid);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:var(--white);color:var(--ink);border:1px solid var(--border)}
.btn.danger{background:var(--white);color:var(--warn);border:1px solid var(--warn-soft)}
.small{font-size:12px;color:var(--muted);line-height:1.55}

/* hero */
.hero{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px}
.hero .label{font-size:12px;color:var(--muted)}
.hero .big{font-size:38px;font-weight:700;letter-spacing:-.035em;line-height:1.08;margin:6px 0 2px;transition:color .25s}
.hero .big.flash{color:var(--accent)}
.hero .big em{font-style:normal;font-size:19px;font-weight:600;color:var(--ink-sec);margin-left:5px}
.hero .sub2{font-size:12.5px;color:var(--ink-sec)}
.curtog{display:flex;gap:4px;background:var(--chip);border-radius:9px;padding:3px}
.curtog button{padding:4px 9px;border-radius:7px;font-size:11.5px;color:var(--muted)}
.curtog button[aria-pressed="true"]{background:var(--white);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(11,11,11,.08)}
.bar{height:7px;border-radius:99px;background:var(--grid);margin:15px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .45s cubic-bezier(.3,.9,.3,1)}
.bar i.over{background:var(--warn)}
.legend{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.pace{margin-top:14px;padding:11px 12px;border-radius:10px;background:#f4f9ff;border:1px solid var(--accent-soft);font-size:12.5px;color:var(--accent-dark);line-height:1.5}
.pace.bad{background:var(--warn-soft);border-color:#f5c3ab;color:#a13d12}
.envel{display:flex;gap:9px;margin-top:10px}
.envel .e{flex:1;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.envel .e .t{font-size:11.5px;color:var(--muted)}
.envel .e .v{font-size:15px;font-weight:700;margin-top:3px;letter-spacing:-.02em}
.envel .e .g{height:5px;border-radius:99px;background:var(--grid);margin-top:8px;overflow:hidden}
.envel .e .g i{display:block;height:100%;background:var(--accent-mid)}

/* calendar */
.cal{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 10px}
.calhd{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
.calhd .m{font-size:15px;font-weight:700;letter-spacing:-.01em}
.calhd .tot{font-size:12px;color:var(--ink-sec);font-weight:600}
.calnav{display:flex;gap:2px}
.calnav button{width:28px;height:28px;border-radius:8px;color:var(--muted);font-size:14px}
.calnav button:hover{background:var(--chip)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);font-size:10.5px;color:var(--muted);text-align:center;padding-bottom:4px}
.wk span:first-child{color:#c25a5a}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.day{height:44px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding-top:2px}
.day .n{font-size:11.5px;color:var(--ink-sec)}
.day .v{font-size:9px;color:var(--accent-dark);font-weight:700;letter-spacing:-.03em;line-height:1}
.day.out .n{color:#cfcec8}
.day.has{background:#f4f9ff}
.day.today{outline:1.5px solid var(--accent);outline-offset:-1.5px}
.day.today .n{color:var(--accent);font-weight:700}

/* ledger */
.daygroup{margin-top:16px}
.dayhd{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 3px 7px}
.tx{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:11px 11px 11px 13px;margin-bottom:7px;width:100%;text-align:left;transition:border-color .15s,background .15s}
.tx[data-sel="1"]{border-color:var(--accent);background:#f4f9ff}
.tx .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--grid);flex:none;display:grid;place-items:center;font-size:11px;color:transparent}
.tx[data-sel="1"] .ck{background:var(--accent);border-color:var(--accent);color:#fff}
.tx .ic{width:32px;height:32px;border-radius:9px;background:var(--chip);display:grid;place-items:center;font-size:15px;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .mname{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mmeta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tx .amt{text-align:right;flex:none}
.tx .amt b{font-size:14.5px;font-weight:700}
.tx .amt span{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.tx .edit{width:28px;height:28px;border-radius:8px;flex:none;color:var(--muted);font-size:13px;display:grid;place-items:center}
.tx .edit:hover{background:var(--chip);color:var(--ink)}
.tag{font-size:10.5px;padding:1.5px 6px;border-radius:5px;background:var(--chip);color:var(--ink-sec)}
.tag.split{background:var(--accent-soft);color:var(--accent-dark)}
.tag.memo{background:#fff6e8;color:#8a5a12}
.tag.pre{background:#efe9fb;color:#5a3fa0}
.strike{text-decoration:line-through;color:var(--muted);font-weight:400;font-size:12px;margin-right:4px}

.selbar{position:absolute;left:14px;right:14px;bottom:14px;background:var(--ink);color:#fff;border-radius:14px;padding:13px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 10px 28px -8px rgba(11,11,11,.5);transform:translateY(150%);transition:transform .28s cubic-bezier(.3,.9,.3,1);z-index:5}
.selbar.show{transform:translateY(0)}
.selbar .st{font-size:13px}
.selbar .st b{display:block;font-size:16px;font-weight:700;margin-top:2px}
.selbar button{background:#fff;color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px}
.selbar button:disabled{background:#4a4a4a;color:#9a9a9a}

.sheet{position:absolute;inset:0;background:rgba(11,11,11,.34);opacity:0;pointer-events:none;transition:opacity .22s;z-index:20;display:flex;align-items:flex-end}
.sheet.show{opacity:1;pointer-events:auto}
.sheetbody{background:var(--white);width:100%;border-radius:20px 20px 0 0;padding:18px;transform:translateY(100%);transition:transform .3s cubic-bezier(.3,.9,.3,1);max-height:94%;overflow-y:auto}
.sheet.show .sheetbody{transform:translateY(0)}
.grab{width:36px;height:4px;border-radius:9px;background:var(--grid);margin:0 auto 14px}
.sheetbody h3{margin:0 0 4px;font-size:18px;font-weight:700;letter-spacing:-.02em}
.plist{width:100%;display:flex;align-items:center;gap:11px;padding:12px 10px;border-radius:12px;text-align:left}
.plist[aria-current="true"]{background:#f4f9ff}
.plist .fl{font-size:20px;flex:none}
.plist .pn{flex:1;min-width:0}
.plist .pn b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.plist .pn span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.plist .ck{color:var(--accent);font-size:14px;flex:none}
.bigopt{width:100%;display:flex;align-items:center;gap:13px;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--white);text-align:left;margin-bottom:9px}
.bigopt:hover{border-color:var(--accent-mid);background:#f9fcff}
.bigopt .em{width:42px;height:42px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:20px;flex:none}
.bigopt b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.bigopt span{display:block;font-size:12px;color:var(--muted);margin-top:2px}

.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0}
.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);font-size:19px;background:var(--white)}
.stepper .n{font-size:30px;font-weight:700;min-width:56px;text-align:center;letter-spacing:-.03em}
.stepper .n small{font-size:14px;font-weight:600;color:var(--muted);margin-left:2px}
.preview{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:6px;background:var(--white)}
.pv-top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--chip);border-bottom:1px solid var(--line)}
.pv-app{font-size:11px;font-weight:700;color:var(--accent-dark)}
.pv-url{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-body{padding:15px 14px 13px;text-align:center}
.pv-who{font-size:12px;color:var(--ink-sec)}
.pv-amt{font-size:27px;font-weight:700;letter-spacing:-.03em;margin:3px 0 2px}
.pv-sub{font-size:11.5px;color:var(--muted)}
.pv-list{margin:12px 0 0;border-top:1px solid var(--line);padding-top:9px;text-align:left}
.pv-list div{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-sec);padding:3px 0}
.pv-cta{margin-top:12px;padding:10px;border-radius:9px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700}
.pv-foot{margin-top:9px;font-size:11.5px;color:var(--accent);font-weight:600}
.msg{background:var(--chip);border-radius:12px;padding:12px 13px;font-size:12.5px;line-height:1.55;white-space:pre-wrap;color:var(--ink-sec);margin-top:6px}

.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--white);font-size:14.5px}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{resize:none;min-height:70px;font-size:14px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.amtin{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:10px;padding:9px 12px;background:var(--white)}
.amtin .cu{color:var(--muted);font-size:14px;flex:none;font-weight:600}
.amtin input{flex:1;border:none;background:none;font-size:22px;font-weight:700;letter-spacing:-.02em;width:100%;padding:0;min-width:0}
.amtin input:focus{outline:none}
.curlist{max-height:300px;overflow-y:auto;margin-top:10px;border:1px solid var(--line);border-radius:12px}
.curitem{width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;text-align:left;border-bottom:1px solid var(--line)}
.curitem:last-child{border-bottom:none}
.curitem:hover{background:var(--surface)}
.curitem[aria-current="true"]{background:#f4f9ff}
.curitem .sy{width:38px;flex:none;font-size:14px;color:var(--ink-sec);text-align:center}
.curitem .nm{flex:1;min-width:0}
.curitem .nm b{display:block;font-size:14px;font-weight:600}
.curitem .nm span{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.curitem .ck{color:var(--accent);flex:none}
.iconpick{max-height:150px;overflow-y:auto}
.catrow{display:flex;gap:6px;flex-wrap:wrap}
.catrow button{font-size:11.5px;padding:6px 10px;border-radius:8px;background:var(--chip);color:var(--ink-sec)}
.catrow button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.catrow button.addc{background:var(--white);border:1px dashed var(--grid);color:var(--accent)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 13px;border-radius:11px;border:1px solid var(--line);background:var(--white)}
.sw{width:44px;height:26px;border-radius:99px;background:var(--grid);position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw[aria-pressed="true"]{background:var(--accent)}
.sw[aria-pressed="true"] i{transform:translateX(18px)}

/* destination search */
.sugg{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--white);margin-top:7px;max-height:196px;overflow-y:auto}
.sugg button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;text-align:left;border-bottom:1px solid var(--line)}
.sugg button:last-child{border-bottom:none}
.sugg button:hover{background:#f4f9ff}
.sugg .fl{font-size:18px}
.sugg .t{flex:1}
.sugg .t b{font-size:14px;font-weight:600}
.sugg .t span{font-size:11.5px;color:var(--muted);margin-left:5px}
.sugg .cu{font-size:11px;color:var(--muted)}
.picked{display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:11px;background:#f4f9ff;border:1px solid var(--accent-soft)}
.picked .fl{font-size:20px}
.picked b{font-size:14.5px}
.picked span{font-size:11.5px;color:var(--accent-dark);display:block;margin-top:2px}
.picked .x{margin-left:auto;color:var(--muted);font-size:13px;padding:4px 7px}

.dropzone{border:1.5px dashed var(--grid);border-radius:16px;padding:18px;text-align:center;background:var(--white)}
.fakeshot{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:left}
.fakeshot .fbar{background:#0b4bd4;color:#fff;padding:9px 12px;font-size:12px;font-weight:600;display:flex;justify-content:space-between}
.fakeshot ul{list-style:none;margin:0;padding:4px 12px 10px}
.fakeshot li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.fakeshot li:last-child{border-bottom:none}
.fakeshot li span{color:var(--muted);font-size:11px;display:block;margin-top:2px}
.scanning{position:relative}
.scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:sweep 1.1s linear infinite}
@keyframes sweep{0%{top:0;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:100%;opacity:0}}
@media(prefers-reduced-motion:reduce){.scanline{animation:none}*{transition-duration:.01ms!important}}

function isMulti(p){p=p||proj();return (p.cities||[]).length>1;}
/* 예산 변경 이력 — 최초 설정도 레코드로 */
var BUDGETLOG=[];
/* 정산 이력 */
var SETTLE=[];
/* 반복(고정) 지출 */
var RECUR=[];
/* 내 정산 계좌 */
var ME={bank:"",acc:"",holder:""};
/* 표본 6명 중앙값 (현지통화) */

var TX=[];

var S={tab:"welcome",pid:null,sel:{},selMode:false,disp:"local",
 nextId:100,scan:"idle",scanRows:[],detail:null,draft:null,cal:"2026-07",focusF:null,
 nf:{name:"",dests:[],adding:false,purpose:"여행",start:"",end:"",bPre:"",bLocal:"",bcur:"KRW",q:""},curTarget:"tx",
 unit:null, msgEdit:false, msgText:"", lastSettle:null};

var $=function(s,r){return (r||document).querySelector(s);};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
function hasProj(){return Object.keys(P).length>0;}
function proj(){return P[S.pid]||{id:"",name:"",city:"",country:"",flag:"",cur:"KRW",cities:[],cash:[],bPre:0,bLocal:0,start:TODAY,end:TODAY,purpose:"여행"};}
function days(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function num(v,d){return Number(v).toLocaleString("ko-KR",{minimumFractionDigits:0,maximumFractionDigits:d});}

/* money: everything computed in KRW, displayed in chosen currency */
function toKRW(amt,cur){return amt*CUR[cur].r;}
function fromKRW(k,cur){return k/CUR[cur].r;}
function fmt(k,cur){
  var c=CUR[cur],v=fromKRW(k,cur);
  var d=(c.dec&&Math.abs(v)<100&&Math.abs(v%1)>0.004)?2:0;
  return c.s+num(v,d);
}
function localCur(){return proj().cur;}
/* main display per S.disp */
function show(k){
  var lc=localCur();
  if(S.disp==="krw") return '<b class="money">'+fmt(k,"KRW")+'</b>';
  return '<b class="money">'+fmt(k,lc)+'</b><span class="approx"> (≈ '+fmt(k,"KRW")+')</span>';
}
function showS(k){ /* single line, small */
  var lc=localCur();
  return S.disp==="krw" ? fmt(k,"KRW") : fmt(k,lc)+" (≈ "+fmt(k,"KRW")+")";
}
function effDisp(){return isMulti()?"krw":S.disp;}
function mainOnly(k){return effDisp()==="krw"?fmt(k,"KRW"):fmt(k,localCur());}
function subOnly(k){return effDisp()==="krw"?"≈ "+fmt(k,localCur()):"≈ "+fmt(k,"KRW");}
/* 정산 맥락 — 항상 원화 기준 */
function krwOnly(k){return fmt(k,"KRW");}

function txs(){return TX.filter(function(t){return t.p===S.pid;}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:(a.t<b.t?1:-1);});}
function mineK(t){var k=toKRW(t.amt,t.cur);return t.split?k/t.split.n:k;}
function byId(id){return TX.filter(function(x){return x.id==id;})[0];}
function spentLocal(){return txs().filter(function(t){return !t.pre&&!isDep(t.cat);}).reduce(function(s,t){return s+mineK(t);},0);}
function spentPre(){return txs().filter(function(t){return t.pre&&!isDep(t.cat);}).reduce(function(s,t){return s+mineK(t);},0);}
function spentDep(){return txs().filter(function(t){return isDep(t.cat);}).reduce(function(s,t){return s+mineK(t);},0);}
function hasCash(){return txs().some(function(t){return t.pm==="cash";})||(proj().cash||[]).length>0;}
function cashInfo(){
  var added=(proj().cash||[]).reduce(function(s,c){return s+toKRW(c.amt,c.cur);},0);
  var used=txs().filter(function(t){return t.pm==="cash";}).reduce(function(s,t){return s+mineK(t);},0);
  return {added:added,used:used,left:added-used};
}
/* 이번 달(달력 월) 현지 지출 */
function spentThisMonth(){
  var ym=TODAY.slice(0,7);
  return txs().filter(function(t){return !t.pre&&!isDep(t.cat)&&t.d.slice(0,7)===ym;})
              .reduce(function(s,t){return s+mineK(t);},0);
}

function unitOf(){ /* "month" | "day" */
  if(S.unit)return S.unit;
  return (days(proj().start,proj().end)+1)>30 ? "month" : "day";
}
function budgetInfo(){
  var p=proj(),sp=spentLocal(),left=p.bLocal-sp;
  var total=days(p.start,p.end)+1;
  var future=p.start>TODAY;
  var elapsed=Math.min(total,Math.max(1,days(p.start,TODAY)+1));
  var remain=Math.max(0,total-elapsed);
  var perDay=future?p.bLocal/total:(remain>0?left/(remain+1):left);
  var landing=future?0:sp/elapsed*total;

  /* 월 단위 — 남은 예산을 남은 개월수로 재분배 */
  var remMonths=Math.max(0.5,(remain+1)/30.4);
  var monthBudget=future?(p.bLocal/Math.max(1,total/30.4)):(left/remMonths);
  var mSpent=spentThisMonth();
  var mLeft=monthBudget-mSpent;
  /* 이번 달 남은 일수 */
  var y=+TODAY.slice(0,4),mo=+TODAY.slice(5,7),dim=new Date(y,mo,0).getDate();
  var dayLeftInMonth=Math.max(1,Math.min(dim-(+TODAY.slice(8,10))+1,remain+1));

  return {p:p,sp:sp,left:left,total:total,elapsed:elapsed,remain:remain,perDay:perDay,landing:landing,future:future,
    pct:Math.min(100,sp/p.bLocal*100),over:sp>p.bLocal,
    monthBudget:monthBudget,mSpent:mSpent,mLeft:mLeft,remMonths:remMonths,
    dayLeftInMonth:dayLeftInMonth,mPct:Math.min(100,monthBudget?mSpent/monthBudget*100:0),
    monthNo:Math.floor((elapsed-1)/30.4)+1,totalMonths:Math.max(1,Math.round(total/30.4))};
}
/* 예산 변경 이력 */
function budgetLog(type){return BUDGETLOG.filter(function(b){return b.p===S.pid&&b.type===type;});}

function toastUndo(m){
  var e=$("#toast");
  e.innerHTML='<span>'+m+'</span><button id="undosettle">되돌리기</button>';
  e.classList.add("show","withbtn");
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){e.classList.remove("show","withbtn");},8000);
}
function revokeSettle(code,isUndo){
  if(!code)return;
  var r=null;
  for(var i=0;i<SETTLE.length;i++)if(SETTLE[i].code===code)r=SETTLE[i];
  if(!r||r.status!=="active")return;
  r.status="revoked";
  r.ids.forEach(function(id){var t=byId(id);if(t)t.split=null;});
  var e=$("#toast");e.classList.remove("show","withbtn");
  render();toast(isUndo?"정산을 되돌렸어요":"정산을 취소했어요 · 링크가 만료됐습니다");
}
function toast(m){var e=$("#toast");e.innerHTML=m;e.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){e.classList.remove("show");},2300);}
function period(p){
  var f=function(d){return (+d.slice(5,7))+"."+(+d.slice(8,10));};
  return f(p.start)+" – "+f(p.end)+" · "+(days(p.start,p.end)+1)+"일";
}

function cityLabel(p){
  var c=p.cities||[{ko:p.city,flag:p.flag}];

}

/* ---------- home ---------- */
function vHome(){
  var b=budgetInfo(),p=b.p,good=b.landing<=p.bLocal;
  var pre=spentPre(),prePct=Math.min(100,p.bPre?pre/p.bPre*100:0);
  var dep=spentDep(), u=unitOf(), multi=isMulti();
  var head, big, sub, gauge, legend;

  if(u==="month"){
    head="이번 달 쓸 수 있는 돈";
    big =mainOnly(Math.max(0,b.future?b.monthBudget:b.mLeft));
    sub = b.future
      ? "출발까지 "+days(TODAY,p.start)+"일 · 예산을 "+b.totalMonths+"개월로 나눈 금액"
      : (+TODAY.slice(5,7))+"월 · 남은 "+b.dayLeftInMonth+"일 · 하루 평균 "+mainOnly(Math.max(0,b.mLeft)/b.dayLeftInMonth);
    gauge=b.mPct; legend='<span>이번 달 '+mainOnly(b.mSpent)+'</span><span>이번 달 예산 '+mainOnly(b.monthBudget)+'</span>';
  }else{
    head=b.future?"하루에 쓸 수 있는 돈":"오늘 쓸 수 있는 돈";
    big =mainOnly(Math.max(0,b.perDay));
    sub = b.future
      ? "출발까지 "+days(TODAY,p.start)+"일 · 현지 예산을 "+b.total+"일로 나눈 금액"
      : "남은 현지 예산 "+mainOnly(b.left)+" · 남은 "+(b.remain+1)+"일로 나눈 금액";
    gauge=b.pct; legend='<span>쓴 돈 '+mainOnly(b.sp)+'</span><span>현지 예산 '+mainOnly(p.bLocal)+'</span>';
  }

  var longStay=(days(p.start,p.end)+1)>30;
  var unitTog = longStay
    ? '<span class="unittog"><button data-unit="day" aria-pressed="'+(u==="day")+'">일</button>'+
      '<button data-unit="month" aria-pressed="'+(u==="month")+'">월</button></span>'
    : '';
  var toggle = multi
    ? '<span class="curtog"><button aria-pressed="true">KRW</button></span>'
    : '<span class="curtog"><button data-disp="local" aria-pressed="'+(S.disp==="local")+'">'+p.cur+'</button>'+
      '<button data-disp="krw" aria-pressed="'+(S.disp==="krw")+'">KRW</button></span>';

  return topbar()+
  (multi?'<div class="tip" style="margin-bottom:10px"><span class="e">🌍</span><p>통화가 여러 개라 <b>원화</b>로 보여드려요. 각 지출은 결제한 통화 그대로 기록됩니다.</p></div>':'')+
  '<div class="hero">'+
    '<div class="rowbetween"><span class="labelwrap">'+unitTog+'<span class="label">'+head+'</span></span>'+toggle+'</div>'+
    '<div class="big" id="bignum">'+big+'</div>'+
    '<div class="sub2">'+sub+'</div>'+
    '<div class="bar"><i class="'+(b.over?"over":"")+'" style="width:'+gauge.toFixed(1)+'%"></i></div>'+
    '<div class="legend">'+legend+'</div>'+
    (u==="month"&&!b.future
      ? '<div class="small" style="margin-top:7px">전체 '+b.totalMonths+'개월 중 '+b.monthNo+'개월차 · 남은 예산 '+mainOnly(b.left)+'</div>'
      : '')+
    (b.future?'<div class="pace">출발일이 되면 <b>'+(u==="month"?"이번 달":"오늘")+' 쓸 수 있는 돈</b>으로 다시 계산해 드릴게요.</div>'
      :'<div class="pace'+(good?"":" bad")+'">'+(good
        ?"이 페이스면 마지막 "+(u==="month"?"달":"날")+"에 <b>"+mainOnly(p.bLocal-b.landing)+"</b>이 남습니다."
        :"이 페이스면 마지막 "+(u==="month"?"달":"날")+"에 <b>"+mainOnly(b.landing-p.bLocal)+"</b>이 모자랍니다.")+'</div>')+
  '</div>'+
  '<div class="envel">'+
    '<div class="e"><div class="t">✈️ 사전 예약</div><div class="v">'+fmt(pre,"KRW")+'</div>'+
      '<div class="g"><i style="width:'+prePct.toFixed(1)+'%"></i></div>'+
      '<div class="rowbetween" style="margin-top:5px"><span class="small">예산 '+fmt(p.bPre,"KRW")+'</span>'+
      '<button class="plusb" data-addbudget="pre">수정</button></div></div>'+
    '<div class="e"><div class="t">🧾 현지 지출</div><div class="v">'+fmt(b.sp,"KRW")+'</div>'+
      '<div class="g"><i style="width:'+b.pct.toFixed(1)+'%"></i></div>'+

  '</div>'+
  (hasCash()?(function(){var c=cashInfo();
    if(c.added<=0)
      return '<div class="cashcard"><div class="rowbetween">'+

        '<span class="cashv">'+mainOnly(c.used)+'</span></div>'+

    return '<div class="cashcard"><div class="rowbetween">'+
      '<span><b>💵 현금 잔액</b><span class="small" style="display:block;margin-top:3px">환전·인출 '+mainOnly(c.added)+' · 사용 '+mainOnly(c.used)+'</span></span>'+
      '<span class="cashv">'+mainOnly(Math.max(0,c.left))+'</span></div>'+
      '<button class="cashbtn" id="addcash">＋ 환전·인출 기록</button></div>';})():'')+
  (dep>0?'<div class="depcard"><span>📦 보증금 <i>회수 예정</i></span><b>'+mainOnly(dep)+'</b></div>':'')+
  (txs().length
    ? '<div class="hd" style="padding-top:20px"><h2 style="font-size:16px">최근 지출</h2><span class="sub">'+txs().length+'건 기록됨</span></div>'+
      txs().slice(0,3).map(function(t){return txRow(t,false);}).join("")
    : '<div class="blank sm"><div class="be">🧾</div><b>첫 지출을 기록해 보세요</b>'+
      '<span>기록할 때마다 위 숫자가 바로 바뀌어요</span>'+
      '<button class="blank-btn" data-tabgo="add">＋ 지출 추가하기</button></div>')+
  '<div style="height:8px"></div>';
}

/* ---------- rows ---------- */
function txRow(t,selectable){
  var k=toKRW(t.amt,t.cur),my=mineK(t),c=catOf(t.cat);
  var alt=(t.cur==="KRW"?localCur():"KRW");
  var amtHtml = t.split
    ? '<b><span class="strike">'+fmt(k,t.cur)+'</span>'+fmt(my,t.cur)+'</b><span>≈ '+fmt(my,alt)+'</span>'
    : '<b>'+fmt(my,t.cur)+'</b><span>≈ '+fmt(my,alt)+'</span>';
  var sel=S.sel[t.id]?1:0;
  return '<div class="tx" data-sel="'+sel+'" '+(selectable?'data-pick="'+t.id+'" role="button" tabindex="0"':'')+'>'+
    (selectable?'<span class="ck">✓</span>':'')+
    '<span class="ic">'+c.i+'</span>'+
    '<span class="mid"><span class="mname">'+esc(t.m)+'</span>'+
      '<span class="mmeta"><span class="tag">'+esc(t.cat)+'</span>'+
      (t.pre?'<span class="tag pre">사전예약</span>':'')+
      (t.split?'<span class="tag split">'+t.split.n+'명 나눔</span>':'')+
      (t.memo?'<span class="tag memo">메모</span>':'')+
      (t.pm==="cash"?'<span class="tag cash">현금</span>':'')+
      (isDep(t.cat)?'<span class="tag dep">회수 예정</span>':'')+
      (t.st==="pending"?'<span class="tag pend">확인 필요</span>':'')+
      '<span>'+t.t+'</span></span></span>'+
    '<span class="amt">'+amtHtml+'</span>'+
    (selectable?'':'<button class="edit" data-edit="'+t.id+'" aria-label="수정하기">✎</button>')+'</div>';
}

/* ---------- calendar ---------- */
function vCal(){
  var ym=S.cal,y=+ym.slice(0,4),m=+ym.slice(5,7);
  var off=new Date(y,m-1,1).getDay(),dim=new Date(y,m,0).getDate();
  var sums={},tot=0;
  txs().forEach(function(t){ if(t.d.slice(0,7)===ym){var dd=+t.d.slice(8,10);sums[dd]=(sums[dd]||0)+mineK(t);tot+=mineK(t);} });
  var cells="";
  for(var i=0;i<off;i++)cells+='<div class="day out"></div>';
  for(var d=1;d<=dim;d++){
    var ds=ym+"-"+String(d).padStart(2,"0"),v=sums[d];
    cells+='<div class="day'+(v?" has":"")+(ds===TODAY?" today":"")+'"><span class="n">'+d+'</span>'+
      (v?'<span class="v">'+shortMoney(v)+'</span>':'')+'</div>';
  }
  return '<div class="cal"><div class="calhd"><div><div class="m">'+y+'년 '+m+'월</div>'+
    '<div class="tot">이 달 '+mainOnly(tot)+' <span class="approx">('+subOnly(tot)+')</span></div></div>'+
    '<div class="calnav"><button data-cal="-1">‹</button><button data-cal="1">›</button></div></div>'+
    '<div class="wk"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>'+
    '<div class="days">'+cells+'</div></div>';
}
function shortMoney(k){
  var cur=S.disp==="krw"?"KRW":localCur(),v=fromKRW(k,cur);
  if(v>=10000)return num(v/10000,1)+"만";
  return num(v,0);
}

function normOf(f){
  if(!f.dests.length||!f.purpose)return null;
  if(f.dests.length>1)return null;
  return NORM[f.dests[0].ko+"|"+f.purpose]||null;
}
function autoBudgetBox(){
  var f=S.nf,nm=normOf(f);
  if(!f.dests.length)return "";
  if(f.dests.length>1)return '<div class="autobox none"><b>여러 도시를 함께 가시는군요</b><span>도시별 물가가 달라 자동 예산은 아직 어려워요. 직접 입력해 주세요.</span></div>';
  var d0=f.dests[0];
  if(!nm||nm.n<5){
    return '<div class="autobox none"><b>아직 표본이 모이는 중이에요</b>'+
      '<span>'+esc(d0.ko)+' · '+esc(f.purpose)+' 기록이 '+(nm?nm.n:0)+'명 있어요. 5명이 되면 평균으로 예산을 잡아드릴게요.</span></div>';
  }
  var d=(f.start&&f.end)?Math.max(1,days(f.start,f.end)+1):0;
  var local=d?nm.perDay*d:0;
  return '<div class="autobox"><div class="ab-t"><b>✨ 자동 예산 수립</b><span>표본 '+nm.n+'명</span></div>'+
    '<span class="ab-s">'+esc(d0.ko)+' · '+esc(f.purpose)+esc(d?" · "+d+"일":"")+' 기준 중앙값이에요</span>'+
    '<div class="ab-r"><span>✈️ 사전 예약</span><b>'+fmt(nm.pre,"KRW")+'</b></div>'+
    '<div class="ab-r"><span>🧾 현지 지출'+(d?" ("+d+"일)":"")+'</span><b>'+(d?fmt(local,"KRW"):"기간을 먼저 정해주세요")+'</b></div>'+
    '<button class="ab-btn" id="autobudget" '+(d?"":"disabled")+'>이 금액으로 채우기</button></div>';
}
function budgetHint(){
  var f=S.nf,bc=CUR[f.bcur];
  var d=(f.start&&f.end)?Math.max(1,days(f.start,f.end)+1):0;
  if(!f.bLocal)return "현지 지출 예산을 넣으면 하루에 얼마씩 쓸 수 있는지 계산해 드릴게요.";
  var per=Number(f.bLocal)/(d||1);
  var s="현지에서 하루 "+bc.s+num(per,0);
  if(f.dests.length===1) s+=" (≈ "+fmt(toKRW(per,f.bcur),f.dests[0].cur)+")";
  if(d)s+=" · "+d+"일 기준";
  s+="입니다. 사전 예약은 하루 예산에서 빠져요.";
  return s;
}

/* ---------- report ---------- */
/* 민트 → 그린 → 블루 그라데이션 팔레트 (인접 색 구분되도록 배열) */
var CATCOLOR=["#12b3a8","#2a78d6","#2a9d5c","#4a63c8","#1aa87e","#2b8fb0",
              "#5aa832","#6b5bd6","#0f9c93","#3f86c9","#3f9e4a","#7a6ee0",
              "#159e88","#2f6fbf","#4faa3e","#8a63d6"];
function catColor(name){
  var a=cats(); for(var i=0;i<a.length;i++) if(a[i].n===name) return CATCOLOR[i%CATCOLOR.length];
  var h=0; for(var j=0;j<name.length;j++)h=(h*31+name.charCodeAt(j))%997;
  return CATCOLOR[h%CATCOLOR.length];
}
function vReport(){
  if(!txs().length) return topbar()+'<div class="hd"><h2>리포트</h2></div>'+
    '<div class="blank"><div class="be">📊</div><b>리포트는 기록이 쌓이면 만들어져요</b>'+
    '<span>지출을 몇 건만 담아도<br>항목별로 정리해 드릴게요.</span>'+
    '<button class="blank-btn" data-tabgo="add">지출 기록하러 가기</button></div>';

  var p=proj(),by={};
  txs().filter(function(t){return !isDep(t.cat);}).forEach(function(t){by[t.cat]=(by[t.cat]||0)+mineK(t);});
  var arr=Object.keys(by).map(function(k){return [k,by[k]];}).sort(function(a,b){return b[1]-a[1];});
  var max=arr.length?arr[0][1]:1;
  var barTot=arr.reduce(function(x,y){return x+y[1];},0)||1;
  var nm=NORM[p.city+"|"+(p.purpose||"여행")], pn=nm?nm.n:0;
  var tripDays=Math.max(1,days(p.start,p.end)+1);
  var cmp;
  if(isMulti()){
    cmp='<div class="card"><div class="soonbox"><div style="font-size:14px;font-weight:700">여러 도시를 함께 다녀오셨네요</div>'+
      '<div class="small" style="margin-top:6px">도시마다 물가가 달라서<br>지금은 또래 비교가 어려워요.</div>'+
      '<div class="small" style="margin-top:9px">도시별로 나눠 기록하면 비교해 드릴게요.</div></div></div>';
  }else if(nm&&pn>=5){
    var keys=Object.keys(nm.cats),mx=0,myTot=0,pTot=0;
    keys.forEach(function(k){
      var av=nm.cats[k]*tripDays;mx=Math.max(mx,av,by[k]||0);myTot+=(by[k]||0);pTot+=av;});
    var diff=Math.round((myTot-pTot)/pTot*100);
    cmp='<div class="card">'+
      '<div class="rowbetween" style="margin-bottom:4px"><span style="font-size:14px;font-weight:700">'+esc(p.city)+' 다녀온 사람들</span>'+
        '<span class="sub">표본 '+pn+'명</span></div>'+
      '<div class="small" style="margin-bottom:14px">'+esc(p.purpose||"여행")+' · '+tripDays+'일 기준으로 환산한 중앙값입니다.</div>'+
      '<div class="rowbetween" style="padding:11px 12px;border-radius:10px;background:'+(diff<=0?"#f4f9ff":"var(--warn-soft)")+';margin-bottom:15px">'+
        '<span style="font-size:12.5px;color:'+(diff<=0?"var(--accent-dark)":"#a13d12")+'">현지 지출 합계</span>'+
        '<span style="font-size:13px;font-weight:700;color:'+(diff<=0?"var(--accent-dark)":"#a13d12")+'">'+
        mainOnly(myTot)+' · 또래보다 '+Math.abs(diff)+'% '+(diff<=0?"적게":"많이")+' 씀</span></div>'+
      keys.map(function(k){
        var me=by[k]||0,av=nm.cats[k]*tripDays,d2=Math.round((me-av)/av*100);
        var lbl=me===0?'<span class="d" style="color:var(--muted)">안 씀</span>'
                      :'<span class="d '+(d2<=0?"less":"more")+'">'+(d2>0?"+":"")+d2+'%</span>';
        return '<div class="cmp"><div class="cmphd"><span>'+esc(k)+'</span>'+lbl+'</div><div class="pairs">'+
          '<div class="prow"><span class="lb">나</span><span class="tr"><i class="me" style="width:'+(me/mx*100).toFixed(1)+'%"></i></span><span class="vv">'+mainOnly(me)+'</span></div>'+
          '<div class="prow"><span class="lb">또래</span><span class="tr"><i class="avg" style="width:'+(av/mx*100).toFixed(1)+'%"></i></span><span class="vv">'+mainOnly(av)+'</span></div>'+
          '</div></div>';
      }).join("")+
      '<div class="hr" style="height:1px;background:var(--line);margin:12px 0"></div>'+
      '<div class="rowbetween"><span style="font-size:12.5px">✈️ 사전 예약</span>'+
        '<span style="font-size:12.5px;font-weight:600">'+fmt(spentPre(),"KRW")+
        ' <span class="d '+((spentPre()-nm.pre)<=0?"less":"more")+'">'+((spentPre()-nm.pre)>0?"+":"")+
        Math.round((spentPre()-nm.pre)/nm.pre*100)+'%</span></span></div>'+
      '<div class="small" style="margin-top:5px">또래 중앙값 '+fmt(nm.pre,"KRW")+' · 출발지에 따라 달라질 수 있어요</div></div>';
  }else{
    var dots="";
    for(var i=1;i<=5;i++)dots+=(i<=pn?'<i>'+i+'</i>':'<i class="empty">'+i+'</i>');
    cmp='<div class="card"><div class="soonbox"><div style="font-size:14px;font-weight:700">'+esc(p.city)+' 다녀온 사람들</div>'+
      '<div class="small" style="margin-top:5px">'+esc(p.purpose||"여행")+'으로 다녀온 사람이<br>5명 모이면 항목별로 비교해 드릴게요.</div>'+
      '<div class="dots">'+dots+'</div><div class="small">지금 '+pn+'명 · '+(5-pn)+'명 더 필요합니다</div></div></div>';
  }
  /* 결제수단별 */
  var pmAgg={};
  txs().filter(function(t){return !isDep(t.cat);}).forEach(function(t){
    var k=t.pm||"card"; pmAgg[k]=(pmAgg[k]||0)+mineK(t);});
  var pmTot=Object.keys(pmAgg).reduce(function(x,k){return x+pmAgg[k];},0)||1;
  var PMN={card:"💳 카드",cash:"💵 현금",account:"🏦 계좌"};
  var pmBlock=Object.keys(pmAgg).length>1
    ? '<div class="card"><div class="sub" style="margin-bottom:11px">결제수단별</div>'+
      Object.keys(pmAgg).sort(function(a,b){return pmAgg[b]-pmAgg[a];}).map(function(k){
        return '<div class="rowbetween" style="padding:5px 0;font-size:13px"><span>'+PMN[k]+'</span>'+
          '<span><b>'+mainOnly(pmAgg[k])+'</b> <i style="color:var(--muted);font-style:normal;font-size:11.5px">'+
          Math.round(pmAgg[k]/pmTot*100)+'%</i></span></div>';}).join("")+'</div>'
    : '';
  var depv=spentDep();
  var depBlock=depv>0?'<div class="card"><div class="rowbetween"><span style="font-size:13.5px">📦 보증금 <span class="tag dep">회수 예정</span></span>'+
    '<b>'+mainOnly(depv)+'</b></div><div class="small" style="margin-top:6px">돌려받을 돈이라 예산·비교에서 빠져요</div></div>':'';
  var lg=BUDGETLOG.filter(function(b){return b.p===S.pid;});
  var lgBlock=lg.length>2?'<div class="card"><div class="sub" style="margin-bottom:10px">예산 변경 이력</div>'+
    lg.map(function(b){return '<div class="rowbetween" style="padding:5px 0;font-size:12.5px">'+
      '<span>'+(+b.d.slice(5,7))+'/'+(+b.d.slice(8,10))+' · '+(b.type==="pre"?"사전 예약":"현지 지출")+
      (b.memo?' <i style="color:var(--muted);font-style:normal">'+esc(b.memo)+'</i>':'')+'</span>'+
      '<b style="color:'+(b.memo==="최초 설정"?"inherit":(b.amt>0?"var(--warn)":"var(--good)"))+'">'+(b.memo==="최초 설정"?"":(b.amt>0?"+":"−"))+fmt(Math.abs(b.amt),"KRW")+'</b></div>';}).join("")+
    '<div class="rowbetween" style="border-top:1px solid var(--line);margin-top:7px;padding-top:9px;font-size:13px">'+
    '<span>현재 예산</span><b>'+fmt(p.bPre+p.bLocal,"KRW")+'</b></div></div>':'';

  return topbar()+
  '<div class="hd"><h2>리포트</h2><span class="sub">'+period(p)+'</span></div>'+
  '<div class="card"><div class="rowbetween" style="margin-bottom:14px"><span class="sub">항목별 지출 · 사전 예약 포함</span>'+
    '<span style="font-weight:700">'+mainOnly(spentLocal()+spentPre())+'</span></div>'+
    arr.map(function(x){
      return '<div class="catbar"><span class="nm"><i class="dot" style="background:'+catColor(x[0])+'"></i>'+esc(x[0])+'</span>'+
        '<span class="track"><i style="width:'+(x[1]/max*100).toFixed(1)+'%;background:'+catColor(x[0])+'"></i></span>'+
        '<span class="vl">'+mainOnly(x[1])+'<i>'+Math.round(x[1]/barTot*100)+'%</i></span></div>';}).join("")+
    '<div class="small" style="margin-top:8px">나눠 낸 금액은 내 몫만 반영됩니다.</div></div>'+
  pmBlock+depBlock+cmp+lgBlock+'<div style="height:14px"></div>';
}

/* ---------- render ---------- */
function render(){
  var v=$("#view"),h;
  if(!hasProj()&&S.tab!=="newproj"){h=vWelcome();}
  else if(S.tab==="done"){h=vDone();}
  else if(S.detail)h=vEditor();
  else if(S.tab==="newproj")h=vNewProj();
  else if(S.tab==="scan")h=vScan();
  else if(S.tab==="add")h=vAdd();
  else h=S.tab==="home"?vHome():S.tab==="ledger"?vLedger():S.tab==="report"?vReport():vMy();
  v.innerHTML=h;
  var tb=document.querySelector(".tabbar");
  if(tb)tb.style.display=(!hasProj()||S.tab==="newproj"||S.tab==="done")?"none":"";
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){
    b.setAttribute("aria-current",!S.detail&&(b.dataset.tab===S.tab||(S.tab==="scan"&&b.dataset.tab==="add")));});
  Array.prototype.forEach.call(document.querySelectorAll(".feat"),function(b){b.setAttribute("aria-current",b.dataset.f===S.focusF);});
  syncSel();v.scrollTop=0;
}
function syncSel(){
  var ids=Object.keys(S.sel).filter(function(k){return S.sel[k];}),bar=$("#selbar");
  if(!S.selMode||S.tab!=="ledger"||S.detail){bar.classList.remove("show");return;}
  var sum=ids.reduce(function(s,id){var t=byId(id);return s+(t?toKRW(t.amt,t.cur):0);},0);
  $("#selcount").textContent=ids.length;
  $("#seltotal").textContent=ids.length?mainOnly(sum):"항목을 골라주세요";
  $("#btnsplit").disabled=!ids.length;bar.classList.add("show");
}

      [["-20","−20%"],["-10","−10%"],["+10","+10%"],["+20","+20%"]].map(function(x){
        return '<button data-bgpct="'+x[0]+'">'+x[1]+'</button>';}).join("")+'</div>'+

function bgDiffText(){
  var p=proj(),curK=(S._bgType==="pre"?p.bPre:p.bLocal);
  var v=Number(rawNum(($("#bg_amt")||{value:"0"}).value))||0;
  var newK=toKRW(v,S._bgCur), d=newK-curK;

  return (d>0?"▲ ":"▼ ")+fmt(Math.abs(d),"KRW")+(d>0?" 늘어나요":" 줄어들어요");
}

function splitCode(){
  if(!S._code)S._code=(Math.random().toString(36).slice(2,7)).toUpperCase();
  return S._code;
}
function splitSheet(n){
  S._lastN=n;
  var ids=Object.keys(S.sel).filter(function(k){return S.sel[k];});
  var items=ids.map(byId),sum=items.reduce(function(s,t){return s+toKRW(t.amt,t.cur);},0),each=sum/n;
  var link="abroaddy.app/s/"+splitCode();
  /* 통화별 소계 */
  var byCur={}; items.forEach(function(t){byCur[t.cur]=(byCur[t.cur]||0)+t.amt;});
  var curLine=Object.keys(byCur).map(function(c){return fmt(toKRW(byCur[c],c),c);}).join(" · ");
  var acc = ME.acc ? ME.bank+" "+ME.acc+" ("+ME.holder+")" : "";
  if(!S.msgText) S.msgText = proj().name+" 정산이에요 💸\n한 사람당 "+krwOnly(each)+
    (acc?"\n\n"+acc:"")+"\n\n링크 열면 무엇을 나눴는지 바로 보여요\n"+link;

  openSheet('<h3>'+items.length+'건을 나눠 보내기</h3>'+
    '<div class="small">합계 '+krwOnly(sum)+(Object.keys(byCur).length>1||items[0].cur!=="KRW"?' &nbsp;('+curLine+')':'')+'</div>'+

/* 입력창은 건드리지 않고 결과 목록만 갱신 — 한글 조합이 깨지지 않도록 */
function curListHTML(){
  var cur=S.curTarget==="budget"?S.nf.bcur:(curTx()||{cur:"KRW"}).cur;
  var q=(S.curq||"").trim().toLowerCase();
  var keys=Object.keys(CUR).filter(function(k){
    if(!q)return true;
    return k.toLowerCase().indexOf(q)>-1||CUR[k].ko.toLowerCase().indexOf(q)>-1;
  });
  if(!keys.length)return '<div class="empty">검색 결과가 없어요</div>';
  return keys.map(function(k){
    return '<button class="curitem" data-txcur="'+k+'" aria-current="'+(k===cur)+'">'+
      '<span class="sy">'+CUR[k].s+'</span><span class="nm"><b>'+k+'</b><span>'+CUR[k].ko+'</span></span>'+
      (k===cur?'<span class="ck">✓</span>':'')+'</button>';
  }).join("");
}
function paintCurList(){var el=$("#cur_list");if(el)el.innerHTML=curListHTML();}
function destListHTML(){
  var q=(S.nf.q||"").trim();
  if(!q)return "";
  var lq=q.toLowerCase();
  var hits=CITIES.filter(function(c){
    return c.ko.indexOf(q)>-1||c.country.indexOf(q)>-1||
      (c.en&&c.en.toLowerCase().indexOf(lq)>-1)||
      (c.al&&c.al.toLowerCase().indexOf(lq)>-1);
  }).sort(function(a,b){
    function rk(c){
      var aw=(c.al||"").toLowerCase().split(" ").filter(Boolean);
      if(aw.indexOf(lq)>-1)return 0;                       /* 별칭 정확히 일치 (LA, NY, KL) */
      if(c.ko.indexOf(q)===0)return 1;                     /* 한글 앞글자 */
      if(c.en.toLowerCase().indexOf(lq)===0)return 2;       /* 영문 앞글자 */
      if(aw.some(function(w){return w.indexOf(lq)===0;}))return 3;
      if(c.country.indexOf(q)===0)return 4;
      return 5;
    }
    var sa=rk(a),sb=rk(b);
    return sa-sb;
  }).slice(0,7);
  if(!hits.length)return '<div class="small" style="margin-top:7px">검색 결과가 없어요. 다른 이름으로 찾아보세요.</div>';
  return '<div class="sugg">'+hits.map(function(c){
    return '<button data-dest="'+CITIES.indexOf(c)+'"><span class="fl">'+c.flag+'</span>'+
      '<span class="t"><b>'+c.ko+'</b><span>'+c.country+'</span></span>'+
      '<span class="cu">'+c.cur+'</span></button>';
  }).join("")+'</div>';
}
function paintDestList(){var el=$("#dest_list");if(el)el.innerHTML=destListHTML();}
function fmtNum(v){
  var t=String(v==null?"":v).replace(/[^0-9.]/g,"");
  if(!t)return "";
  var q=t.split("."),head=q[0]?Number(q[0]).toLocaleString("ko-KR"):"0";
  return q.length>1?head+"."+q[1].slice(0,2):head;
}
function rawNum(v){return String(v==null?"":v).replace(/,/g,"");}
function nowHM(){var d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function curSheet(){
  openSheet('<h3>통화 선택</h3><div class="small" style="margin-bottom:10px">전 세계에서 실제로 쓰이는 통화는 약 180가지예요. 자주 가는 곳 위주로 담았어요.</div>'+
    '<input class="inp" id="cur_q" placeholder="통화 이름이나 코드로 검색" value="'+esc(S.curq||"")+'" autocomplete="off">'+
    '<div class="curlist" id="cur_list">'+curListHTML()+'</div>'+
    '<button class="btn ghost" id="btnclose" style="margin-top:10px">닫기</button>');
}

    '<div class="field"><label>이름</label><input class="inp" id="c_name" placeholder="예: 기념품, 세탁"></div>'+

  if(e.target.id==="autobudget"){
    saveNF();var f=S.nf,nm=normOf(f),d=Math.max(1,days(f.start,f.end)+1);
    if(!nm)return;
    f.bcur="KRW";f.bPre=String(Math.round(nm.pre));f.bLocal=String(Math.round(nm.perDay*d));
    render();toast("또래 평균으로 예산을 채웠어요<br>필요하면 바로 고쳐도 됩니다");return;}
  if(e.target.id==="ncreate"){
    saveNF();var f=S.nf;
    if(!f.dests.length){toast("어디로 가는지 골라주세요");return;}
    if(!f.name){toast("프로젝트 이름을 적어주세요");return;}
    if(!f.start||!f.end){toast("기간을 선택해 주세요");return;}
    if(days(f.start,f.end)<0){toast("종료일이 시작일보다 빠릅니다");return;}
    if(!Number(f.bLocal)){toast("현지 지출 예산을 입력해 주세요");return;}
    var key="p"+Date.now();
    var d0=f.dests[0];
    var sameCur=f.dests.every(function(x){return x.cur===d0.cur;});
    P[key]={id:key,name:f.name,city:d0.ko,country:d0.country,flag:d0.flag,cur:sameCur?d0.cur:"KRW",
      cities:f.dests.map(function(x){return {ko:x.ko,flag:x.flag,cur:x.cur};}),cash:[],
      bPre:toKRW(Number(f.bPre)||0,f.bcur),bLocal:toKRW(Number(f.bLocal),f.bcur),purpose:f.purpose,
      start:f.start,end:f.end};
    BUDGETLOG.push({p:key,type:"pre",amt:P[key].bPre,d:TODAY,memo:"최초 설정"});
    BUDGETLOG.push({p:key,type:"local",amt:P[key].bLocal,d:TODAY,memo:"최초 설정"});
    S.pid=key;S.tab=(Object.keys(P).length===1?"done":"home");S.disp="local";
    S.cal=(f.end<TODAY?f.end:(f.start>TODAY?f.start:TODAY)).slice(0,7);
    S.nf={name:"",dests:[],adding:false,purpose:"여행",start:"",end:"",bPre:"",bLocal:"",bcur:"KRW",q:""};
    render();toast("첫 프로젝트를 만들었어요<br>＋ 를 눌러 지출을 기록해 보세요");return;}

  /* scan */
  if(e.target.id==="btnscan"){
    S.scan="loading";render();
    setTimeout(function(){
      var SRC=S.scanSrc||"card";
      S.scanRows=S.pid==="aarhus"
        ?[{m:"Netto Trøjborg",amt:214,cur:"DKK",cat:"식비",d:TODAY,t:"18:12",memo:"",pre:false},
          {m:"Aarhus Cykel",amt:320,cur:"DKK",cat:"생활용품",d:TODAY,t:"15:40",memo:"",pre:false},
          {m:"Baresso Coffee",amt:48,cur:"DKK",cat:"식비",d:TODAY,t:"10:05",memo:"",pre:false}]
        :[{m:"Jia Jia Tang Bao",amt:168,cur:"CNY",cat:"식비",d:TODAY,t:"12:41",memo:"",pre:false},
          {m:"Didi Chuxing",amt:46,cur:"CNY",cat:"교통비",d:TODAY,t:"11:02",memo:"",pre:false},
          {m:"Lawson 편의점",amt:23,cur:"CNY",cat:"생활용품",d:TODAY,t:"09:20",memo:"",pre:false}];
      S.scanRows.forEach(function(r){r.src=SRC;r.pm=(SRC==="receipt"?"cash":"card");});
      if(SRC==="receipt")S.scanRows=[S.scanRows[0]];
      S.scan="done";render();},1500);
    return;}
  if(e.target.id==="btncancel"){S.scan="idle";render();return;}
  if(e.target.id==="btnsave"){
    S.scanRows.forEach(function(r){
      TX.push({id:S.nextId++,p:S.pid,d:r.d,t:r.t,m:r.m,amt:r.amt,cur:r.cur,cat:r.cat,split:null,
        memo:r.memo||"",pre:!!r.pre,src:r.src||"card",keep:!!r.keep,pm:r.pm||"card"});});
    var cnt=S.scanRows.length;S.scan="idle";S.scanRows=[];S.tab="home";render();
    var big=$("#bignum");if(big){big.classList.add("flash");setTimeout(function(){big.classList.remove("flash");},700);}
    toast(cnt+"건을 기록했어요 · 오늘 쓸 수 있는 돈이 바뀌었습니다");return;}

  if((el=e.target.closest("[data-disp]"))){S.disp=el.dataset.disp;render();return;}
});

function curTx(){var d=S.detail;return d.kind==="scan"?S.scanRows[d.i]:(d.kind==="new"?S.draft:byId(d.id));}
function saveNF(){
  var q=$("#n_q"),n=$("#n_name"),s=$("#n_start"),e2=$("#n_end"),pre=$("#n_pre"),lo=$("#n_local");
  if(q)S.nf.q=q.value; if(n)S.nf.name=n.value.trim();
  if(s)S.nf.start=s.value; if(e2)S.nf.end=e2.value;
  if(pre)S.nf.bPre=rawNum(pre.value); if(lo)S.nf.bLocal=rawNum(lo.value);
}

document.addEventListener("input",function(e){
  if(e.target.id==="cur_q"){S.curq=e.target.value;paintCurList();return;}
  if(e.target.id==="n_q"){S.nf.q=e.target.value;paintDestList();return;}
  if(e.target.id==="bg_amt"){
    var f2=fmtNum(e.target.value);
    if(e.target.value!==f2){e.target.value=f2;try{e.target.setSelectionRange(f2.length,f2.length);}catch(_){}}
    var dt2=$("#bg_diff"); if(dt2)dt2.textContent=bgDiffText(); return;}
  if(["n_pre","n_local","n_start","n_end"].indexOf(e.target.id)>-1){
    if(e.target.id==="n_pre"||e.target.id==="n_local"){
      var f2=fmtNum(e.target.value);
      if(e.target.value!==f2){e.target.value=f2;
        try{e.target.setSelectionRange(f2.length,f2.length);}catch(_){}}
    }
    saveNF();var t=$("#n_tip p");if(t)t.innerHTML=budgetHint();
    var ab=$("#n_auto");if(ab)ab.innerHTML=autoBudgetBox();return;}
  if(e.target.id==="f_amt"&&S.detail){
    var t2=curTx(),v=Number(e.target.value)||0;
    var h=$("#f_hint");if(h)h.textContent=amtHint({amt:v,cur:t2.cur});}
});
document.addEventListener("keydown",function(e){
  if(e.key===" "||e.key==="Enter"){var el=e.target.closest("[data-pick]");if(el){e.preventDefault();el.click();}}
});

render();
})();
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f9fe0"/>
      <stop offset="0.5" stop-color="#2f7de0"/>
      <stop offset="1" stop-color="#7a6ee6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#12224e" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#g)"/>
  <rect width="512" height="512" rx="116" fill="url(#sheen)"/>

  <!-- sparkles -->
  <circle cx="150" cy="150" r="9" fill="#fff" opacity="0.85"/>
  <circle cx="384" cy="132" r="13" fill="#fff" opacity="0.9"/>
  <circle cx="410" cy="196" r="7" fill="#fff" opacity="0.7"/>

  <g filter="url(#soft)">
    <!-- cupped hand / palm receiving -->
    <path d="M86 300 h340 a22 22 0 0 1 22 22 c0 74 -96 118 -192 118 S64 396 64 322 a22 22 0 0 1 22 -22 z" fill="#ffffff"/>
    <!-- coin dropping in -->
    <circle cx="256" cy="202" r="78" fill="#ffffff"/>
    <circle cx="256" cy="202" r="78" fill="none" stroke="#eaf1ff" stroke-width="6"/>
    <text x="256" y="238" text-anchor="middle" font-size="108" font-weight="800"
          fill="url(#g)" font-family="Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif">₩</text>
  </g>
</svg>
